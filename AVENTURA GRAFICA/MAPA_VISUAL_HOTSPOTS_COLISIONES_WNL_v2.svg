<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1080" viewBox="0 0 3840 1080">
<title>WNL - Mapa visual v2 de hotspots y colisiones</title>
<desc>Plano técnico esquemático v2 de la habitación panorámica 3840 por 1080, revisado según la imagen conceptual. No es arte final. Secuencia: archivadores, escritorio/PC, rack de equipos, biblioteca central, cajonera y reloj, cama con mesa baja, armario. Muestra muebles, colisiones, circulación, puntos de aproximación, hotspots y dos encuadres de cámara.</desc>
<defs>
 <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#294052" stroke-width="2" opacity=".55"/></pattern>
 <pattern id="walk" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M0 48L48 0" stroke="#2e8b74" stroke-width="3" opacity=".18"/></pattern>
 <pattern id="carpet" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 36H36V0" fill="none" stroke="#8a6d3b" stroke-width="2" opacity=".25"/></pattern>
 <style>
 text{font-family:Arial,sans-serif;fill:#e8edf2}
 .small{font-size:24px}.med{font-size:30px}.large{font-size:42px;font-weight:bold}
 .furniture{fill:#33485a;stroke:#a9bdca;stroke-width:5}
 .collision{fill:#df665e;fill-opacity:.23;stroke:#ff786d;stroke-width:7;stroke-dasharray:18 12}
 .hot{fill:#f4b942;stroke:#fff0b8;stroke-width:5}
 .approach{fill:#49c59a;fill-opacity:.2;stroke:#49c59a;stroke-width:5;stroke-dasharray:10 8}
 .camera{fill:none;stroke:#67b7ed;stroke-width:7;stroke-dasharray:22 14}
 .label{font-size:30px;font-weight:bold;fill:#fff}
 .walkbehind{fill:#3d5a75;fill-opacity:.85;stroke:#7fb3d9;stroke-width:4;stroke-dasharray:8 6}
 .carpet{fill:#4a3a28;fill-opacity:.55;stroke:#a8845a;stroke-width:4}
 </style>
</defs>
<rect width="3840" height="1080" fill="#101b29"/>
<rect width="3840" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="1080" class="camera"/>
<rect x="1920" y="0" width="1920" height="1080" class="camera"/>
<text x="60" y="70" class="large">WNL · HABITACIÓN — MAPA TÉCNICO v2 (SEGÚN IMAGEN CONCEPTUAL)</text>
<text x="60" y="112" class="med">3840 × 1080 px · Cámara 1920 × 1080 · PROPUESTA PENDIENTE DE APROBACIÓN · Secuencia: archivadores → escritorio/PC → rack → biblioteca → cajonera+reloj → cama → armario</text>
<text x="80" y="165" class="med" fill="#67b7ed">ENCUADRE 1 · X 0–1920</text>
<text x="1980" y="165" class="med" fill="#67b7ed">ENCUADRE 2 · X 1920–3840</text>
<path d="M0 760H3840V1080H0Z" fill="#263746" opacity=".9"/>
<!-- alfombra transitable -->
<rect x="1500" y="880" width="900" height="155" rx="14" class="carpet" fill="url(#carpet)"/>
<text x="1840" y="968" class="small" fill="#d9b98a">ALFOMBRA (TRANSITABLE)</text>
<!-- banda transitable -->
<path d="M0 850H3840V1015H0Z" fill="url(#walk)" stroke="#49c59a" stroke-width="5" stroke-dasharray="18 12"/>
<text x="80" y="995" class="med" fill="#72e0b8">BANDA PRINCIPAL TRANSITABLE · Y 850–1015 (referencia)</text>
<!-- furniture bodies and collision footprints -->
<g>
 <rect x="60" y="330" width="260" height="495" rx="14" class="furniture"/><text x="80" y="400" class="small">ARCHIVADORES</text><rect x="60" y="730" width="260" height="95" class="collision"/>
 <rect x="380" y="490" width="600" height="335" rx="18" class="furniture"/><text x="500" y="545" class="label">ESCRITORIO / PC</text><rect x="380" y="730" width="600" height="95" class="collision"/>
 <rect x="520" y="690" width="180" height="190" rx="22" class="furniture"/><text x="545" y="780" class="small">SILLA</text><rect x="540" y="800" width="140" height="75" class="collision"/>
 <rect x="1080" y="500" width="480" height="325" rx="16" class="furniture"/><text x="1160" y="560" class="label">RACK EQUIPOS</text><rect x="1080" y="730" width="480" height="95" class="collision"/>
 <rect x="1150" y="420" width="240" height="170" rx="12" class="furniture"/><text x="1180" y="485" class="small">RADIO</text>
 <rect x="1360" y="610" width="200" height="180" rx="12" class="furniture"/><text x="1370" y="680" class="small">GRABADORA</text>
 <rect x="1620" y="300" width="560" height="490" rx="16" class="furniture"/><text x="1760" y="365" class="label">BIBLIOTECA</text><rect x="1620" y="690" width="560" height="100" class="collision"/>
 <rect x="2320" y="520" width="330" height="305" rx="14" class="furniture"/><text x="2350" y="585" class="label">CAJONERA</text><rect x="2320" y="730" width="330" height="95" class="collision"/>
 <rect x="2390" y="170" width="160" height="160" rx="80" class="furniture"/><text x="2420" y="265" class="small">RELOJ</text>
 <rect x="2800" y="500" width="680" height="350" rx="22" class="furniture"/><text x="3040" y="570" class="large">CAMA</text><rect x="2800" y="740" width="680" height="110" class="collision"/>
 <rect x="3540" y="330" width="260" height="520" rx="14" class="furniture"/><text x="3560" y="400" class="small">ARMARIO</text><rect x="3540" y="730" width="260" height="120" class="collision"/>
</g>
<!-- walk-behind: mesa baja delante de la cama -->
<rect x="2980" y="880" width="320" height="110" rx="16" class="walkbehind"/><text x="3010" y="945" class="small">MESA BAJA (WALK-BEHIND)</text>
<!-- approach zones -->
<g class="approach">
 <ellipse cx="190" cy="850" rx="100" ry="45"/>
 <ellipse cx="450" cy="850" rx="95" ry="42"/><ellipse cx="760" cy="850" rx="95" ry="42"/><ellipse cx="610" cy="905" rx="90" ry="40"/>
 <ellipse cx="1180" cy="850" rx="100" ry="42"/><ellipse cx="1320" cy="850" rx="90" ry="40"/><ellipse cx="1460" cy="850" rx="90" ry="42"/><ellipse cx="1120" cy="890" rx="85" ry="38"/>
 <ellipse cx="1740" cy="850" rx="110" ry="42"/><ellipse cx="2020" cy="850" rx="110" ry="42"/>
 <ellipse cx="2430" cy="850" rx="100" ry="42"/><ellipse cx="2540" cy="875" rx="90" ry="40"/>
 <ellipse cx="2890" cy="880" rx="110" ry="42"/><ellipse cx="3140" cy="1000" rx="95" ry="38"/><ellipse cx="3660" cy="870" rx="105" ry="42"/>
 <ellipse cx="870" cy="850" rx="90" ry="40"/>
</g>
<!-- hotspot markers -->
<g class="hot">
 <circle cx="715" cy="625" r="30"/><circle cx="480" cy="680" r="30"/><circle cx="610" cy="735" r="30"/><circle cx="190" cy="560" r="30"/>
 <circle cx="1900" cy="420" r="30"/><circle cx="2050" cy="610" r="30"/><circle cx="1250" cy="650" r="30"/><circle cx="1270" cy="510" r="30"/><circle cx="1460" cy="700" r="30"/><circle cx="1200" cy="610" r="30"/>
 <circle cx="2480" cy="660" r="30"/><circle cx="3140" cy="690" r="30"/><circle cx="2470" cy="250" r="30"/><circle cx="3670" cy="620" r="30"/><circle cx="3140" cy="935" r="30"/><circle cx="870" cy="760" r="30"/>
</g>
<g fill="#182333" font-size="23" font-weight="bold" text-anchor="middle">
 <text x="715" y="633">01</text><text x="480" y="688">02</text><text x="610" y="743">03</text><text x="190" y="568">16</text>
 <text x="1900" y="428">04</text><text x="2050" y="618">05</text><text x="1250" y="658">06</text><text x="1270" y="518">07</text><text x="1460" y="708">08</text><text x="1200" y="618">10</text>
 <text x="2480" y="668">09</text><text x="3140" y="698">11</text><text x="2470" y="258">12</text><text x="3670" y="628">13</text><text x="3140" y="943">14</text><text x="870" y="768">15</text>
</g>
<!-- legend -->
<rect x="60" y="190" width="700" height="230" rx="18" fill="#0b1420" stroke="#8297a8" stroke-width="3" opacity=".96"/>
<text x="90" y="235" class="med">LEYENDA</text>
<rect x="90" y="260" width="38" height="28" class="collision"/><text x="150" y="285" class="small">Colisión sólida (simplificada)</text>
<ellipse cx="110" cy="325" rx="24" ry="13" class="approach"/><text x="150" y="334" class="small">Punto / zona de aproximación</text>
<circle cx="110" cy="365" r="17" class="hot"/><text x="150" y="374" class="small">Hotspot numerado (H01–H16)</text>
<rect x="90" y="392" width="38" height="20" class="walkbehind"/><text x="150" y="408" class="small">Walk-behind (sin colisión)</text>
<text x="820" y="1045" class="small">ESQUEMA DE BLOQUEO v2: no es ilustración final. Distribución derivada de la revisión visual de la imagen conceptual; pendiente de aprobación.</text>
</svg>
